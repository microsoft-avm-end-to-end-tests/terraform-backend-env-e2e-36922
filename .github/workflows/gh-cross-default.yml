# Generated by scripts\Export-Fixtures.ps1; cross-tenant parameterization of pinned documentation.
name: Terraform backend gh-cross-default (pinned source)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Provider identity and shared authentication flags.
      ARM_TENANT_ID: ${{ vars.CSUTF_AZAPI_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.CSUTF_AZAPI_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.CSUTF_AZAPI_CLIENT_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

      # Override only the backend identity; other settings use fallback.
      ARM_BACKEND_CLIENT_ID: ${{ vars.STATE_CLIENT_ID }}
      ARM_BACKEND_TENANT_ID: ${{ vars.STATE_TENANT_ID }}

      # Non-secret storage location passed during initialization.
      STATE_STORAGE_ACCOUNT_NAME: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
      STATE_CONTAINER_NAME: ${{ vars.STATE_CONTAINER_NAME }}
      STATE_KEY: ${{ vars.STATE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate fixtures and prepare isolated run
        shell: pwsh
        run: |
          .\scripts\Test-Fixtures.ps1
          .\scripts\Initialize-Run.ps1 -Mode gh-default -Topology cross-tenant
        env:
          AZAPI_CLIENT_ID: ${{ vars.CSUTF_AZAPI_CLIENT_ID }}
          AZAPI_OBJECT_ID: ${{ vars.CSUTF_AZAPI_OBJECT_ID }}
          AZAPI_TENANT_ID: ${{ vars.CSUTF_AZAPI_TENANT_ID }}
          AZAPI_SUBSCRIPTION_ID: ${{ vars.CSUTF_AZAPI_SUBSCRIPTION_ID }}
          STATE_CLIENT_ID: ${{ vars.STATE_CLIENT_ID }}
          STATE_TENANT_ID: ${{ vars.STATE_TENANT_ID }}
          STATE_SUBSCRIPTION_ID: ${{ vars.STATE_SUBSCRIPTION_ID }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - uses: actions/cache@v4
        with:
          path: .build\go
          key: go-${{ runner.os }}-1.26.4-0c5e9bef8b6d76866b0f0ddedab5b72af51bcc27

      - name: Build pinned Terraform source (never a release binary)
        shell: pwsh
        run: .\scripts\Build-Terraform.ps1 -CI GitHub

      - name: Initialize backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          Set-Location $env:HARNESS_WORK_DIR

          & "$env:HARNESS_SCRIPT_DIR\Assert-Run.ps1" -Mode gh-default -Phase Init

          terraform init -input=false `
            "-backend-config=storage_account_name=$env:STATE_STORAGE_ACCOUNT_NAME" `
            "-backend-config=container_name=$env:STATE_CONTAINER_NAME" `
            "-backend-config=key=$env:STATE_KEY"

      - name: Plan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          Set-Location $env:HARNESS_WORK_DIR

          & "$env:HARNESS_SCRIPT_DIR\Assert-Run.ps1" -Mode gh-default -Phase Plan
          try {
            terraform plan -input=false -out=tfplan
            & "$env:HARNESS_SCRIPT_DIR\Test-Plan.ps1" -Mode gh-default
          } finally {
            & "$env:HARNESS_SCRIPT_DIR\Remove-Run.ps1"
          }

      - name: Remove local plan and state even after failure
        if: always()
        shell: pwsh
        run: .\scripts\Remove-Run.ps1

      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gh-cross-default-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence\*.json
          if-no-files-found: ignore
          retention-days: 7
