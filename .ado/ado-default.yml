# Generated by scripts\Export-Fixtures.ps1; authentication comes from pinned documentation.
trigger: none
pr: none

pool:
  vmImage: windows-2022

steps:
  - checkout: self

  - pwsh: |
      .\scripts\Test-Fixtures.ps1
      .\scripts\Initialize-Run.ps1 -Mode ado-default
    displayName: Validate fixtures and prepare isolated run
    env:
      AZAPI_CLIENT_ID: $(AZAPI_CLIENT_ID)
      AZAPI_TENANT_ID: $(AZAPI_TENANT_ID)
      AZAPI_SUBSCRIPTION_ID: $(AZAPI_SUBSCRIPTION_ID)
      STATE_CLIENT_ID: $(STATE_CLIENT_ID)
      STATE_TENANT_ID: $(STATE_TENANT_ID)
      STATE_SUBSCRIPTION_ID: $(STATE_SUBSCRIPTION_ID)
      STATE_STORAGE_ACCOUNT_NAME: $(STATE_STORAGE_ACCOUNT_NAME)
      STATE_CONTAINER_NAME: $(STATE_CONTAINER_NAME)
      STATE_KEY: $(STATE_KEY)

  - task: GoTool@0
    displayName: Install pinned Go toolchain
    inputs:
      version: '1.26.4'

  - task: Cache@2
    displayName: Cache Go modules and compilation only
    inputs:
      key: '"go" | "$(Agent.OS)" | "1.26.4" | "e8195f605d24299788cdf36738915d84563e4c58"'
      path: '$(Build.SourcesDirectory)\.build\go'

  - pwsh: .\scripts\Build-Terraform.ps1 -CI AzurePipelines
    displayName: Build pinned Terraform source (never a release binary)

  - task: AzureCLI@2
    displayName: "[Terraform] Initialize backend"
    inputs:
      azureSubscription: sc-tf36922-state
      scriptType: pscore
      scriptLocation: inlineScript
      visibleAzLogin: false
      inlineScript: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        Set-Location $env:HARNESS_WORK_DIR

        # Initialization needs only the state identity.
        $clientId = $env:AZURESUBSCRIPTION_CLIENT_ID
        $tenantId = $env:AZURESUBSCRIPTION_TENANT_ID
        $connectionId = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID
        $env:ARM_CLIENT_ID = $clientId
        $env:ARM_TENANT_ID = $tenantId
        $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $connectionId

        & "$env:HARNESS_SCRIPT_DIR\Assert-Run.ps1" -Mode ado-default -Phase Init

        terraform init -input=false `
          "-backend-config=storage_account_name=$env:STATE_STORAGE_ACCOUNT_NAME" `
          "-backend-config=container_name=$env:STATE_CONTAINER_NAME" `
          "-backend-config=key=$env:STATE_KEY"

        # Pass only non-secret backend identity metadata to the plan task.
        Write-Host "##vso[task.setvariable variable=STATE_CLIENT_ID]$clientId"
        Write-Host "##vso[task.setvariable variable=STATE_TENANT_ID]$tenantId"
        Write-Host "##vso[task.setvariable variable=STATE_SERVICE_CONNECTION_ID]$connectionId"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

      STATE_STORAGE_ACCOUNT_NAME: $(STATE_STORAGE_ACCOUNT_NAME)
      STATE_CONTAINER_NAME: $(STATE_CONTAINER_NAME)
      STATE_KEY: $(STATE_KEY)

  - task: AzureCLI@2
    displayName: "[Terraform] Plan"
    inputs:
      azureSubscription: sc-tf36922-provider
      scriptType: pscore
      scriptLocation: inlineScript
      visibleAzLogin: false
      inlineScript: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        Set-Location $env:HARNESS_WORK_DIR

        # Provider identity comes from this task's service connection.
        $env:ARM_CLIENT_ID = $env:AZURESUBSCRIPTION_CLIENT_ID
        $env:ARM_TENANT_ID = $env:AZURESUBSCRIPTION_TENANT_ID
        $env:ARM_SUBSCRIPTION_ID = az account show --query id --output tsv
        $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

        & "$env:HARNESS_SCRIPT_DIR\Assert-Run.ps1" -Mode ado-default -Phase Plan
        try {
          terraform plan -input=false -out=tfplan
          & "$env:HARNESS_SCRIPT_DIR\Test-Plan.ps1" -Mode ado-default
        } finally {
          & "$env:HARNESS_SCRIPT_DIR\Remove-Run.ps1"
        }
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

      # Only the backend identity and service connection differ.
      ARM_BACKEND_CLIENT_ID: $(STATE_CLIENT_ID)
      ARM_BACKEND_TENANT_ID: $(STATE_TENANT_ID)
      ARM_BACKEND_OIDC_AZURE_SERVICE_CONNECTION_ID: $(STATE_SERVICE_CONNECTION_ID)

  - pwsh: .\scripts\Remove-Run.ps1
    displayName: Remove local plan and state even after failure
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: Publish sanitized evidence only
    condition: and(always(), ne(variables['HARNESS_RUN_NAME'], ''))
    inputs:
      targetPath: '$(Build.SourcesDirectory)\evidence'
      artifact: evidence-ado-default-$(Build.BuildId)-$(System.JobAttempt)
